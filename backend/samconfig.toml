# SAM deployment configuration for AWS CloudCLI backend.
# Adjust `region` and parameters as needed, then run: sam deploy
version = 0.1

[default.global.parameters]
stack_name = "aws-cloudcli-backend"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
# Set your Amplify URL as CorsOrigin in production to lock down CORS.
parameter_overrides = "BedrockModelId=\"amazon.nova-lite-v1:0\" CorsOrigin=\"*\""
